[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "group-26-student-a-api"
version = "1.0.0"
description = "Student A Return20 feature service for Group 26"
requires-python = ">=3.12,<3.13"
authors = [
    {name = "Zheke Yi"}
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "requests>=2.32,<3",
    "xgboost==3.0.5",
    "pandas==2.2.2",
    "scikit-learn==1.6.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true
